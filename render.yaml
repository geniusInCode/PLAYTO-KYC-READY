services:
  - type: web
    name: playto-kyc
    runtime: python
    region: oregon
    plan: free
    buildCommand: cd frontend && npm install && npm run build && cd ../backend && pip install -r requirements.txt
    startCommand: cd backend && python manage.py migrate --noinput && python manage.py collectstatic --noinput && python seed.py && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: playto-kyc-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: playto-kyc.onrender.com
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings

databases:
  - name: playto-kyc-db
    plan: free
    region: oregon
